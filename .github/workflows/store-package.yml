name: Build Microsoft Store package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Store upload package
        shell: pwsh
        run: ./scripts/Build.ps1 -Configuration Release -Architecture x64 -StoreUpload -OutputDirectory artifacts

      - name: Upload Store package
        uses: actions/upload-artifact@v4
        with:
          name: Daychime-store-upload
          path: artifacts/Daychime.msixupload
          if-no-files-found: error
